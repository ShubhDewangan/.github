name: Warden Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: '${{ github.workspace }}/pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Warden Engine
        run: pnpm build

      - name: Run Warden Scan
        run: node packages/cli/dist/index.js scan . --sarif warden-results.sarif
        continue-on-error: true

      - name: Upload SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: warden-results.sarif